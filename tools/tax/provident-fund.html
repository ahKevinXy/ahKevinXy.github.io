<script>!function(){var t=function(){try{return new URLSearchParams(window.location.search).get("docusaurus-theme")}catch(t){}}()||function(){try{return window.localStorage.getItem("theme")}catch(t){}}();document.documentElement.setAttribute("data-theme",t||"light"),document.documentElement.setAttribute("data-theme-choice",t||"light")}(),function(){try{for(var[t,e]of new URLSearchParams(window.location.search).entries())if(t.startsWith("docusaurus-data-")){var a=t.replace("docusaurus-data-","data-");document.documentElement.setAttribute(a,e)}}catch(t){}}()</script><div id=__docusaurus><div role=region aria-label=跳到主要内容><a class=skipToContent_si3E href=#__docusaurus_skipToContent_fallback>跳到主要内容</a></div><main id=__docusaurus_skipToContent_fallback class=page_kndm><div class=container_llPL><header class=heading_mYXZ><span>FINANCE CALCULATOR</span><h1>公积金贷款计算器 - 额度、月供与冲还贷测算</h1><p>使用自定义参数估算公积金贷款额度，计算贷款月供、月冲现金支出与年冲本金省息，比较商业贷款、公积金贷款和组合贷款成本。</header><div class=tabs_MAkT role=tablist aria-label=计算模式><button type=button role=tab id=provident-estimate aria-selected=true aria-controls=provident-panel>额度估算</button><button type=button role=tab id=provident-loan aria-selected=false aria-controls=provident-panel>贷款方案</button><button type=button role=tab id=provident-offset aria-selected=false aria-controls=provident-panel>月冲还贷</button><button type=button role=tab id=provident-annual-offset aria-selected=false aria-controls=provident-panel>年冲本金</button><button type=button role=tab id=provident-compare aria-selected=false aria-controls=provident-panel>公积金与商贷对比</button></div><div class=split_hYY9 role=tabpanel id=provident-panel aria-labelledby=provident-estimate><form class=panel_jlQC><h2>额度估算<!-- -->参数</h2><div class=fields_I0qf><label class=field_WYGs><span>公积金账户余额</span><span class=inputWrap_wYUx><input type=number min=0 step=any required aria-label=公积金账户余额 value=50000 /><span>元</span></span></label><label class=field_WYGs><span>账户余额倍数</span><span class=inputWrap_wYUx><input type=number min=0 step=any required aria-label=账户余额倍数 max=1000 value=20 /><span>倍</span></span><small>示例 20 倍，请填写当地适用规则</small></label><label class=field_WYGs><span>家庭月收入</span><span class=inputWrap_wYUx><input type=number min=0 step=any required aria-label=家庭月收入 value=15000 /><span>元</span></span></label><label class=field_WYGs><span>其他月负债</span><span class=inputWrap_wYUx><input type=number min=0 step=any required aria-label=其他月负债 value=0 /><span>元</span></span></label><label class=field_WYGs><span>月供收入比例上限</span><span class=inputWrap_wYUx><input type=number min=0 step=any required aria-label=月供收入比例上限 max=100 value=50 /><span>%</span></span><small>先按收入比例计算，再扣除其他负债</small></label><label class=field_WYGs><span>当地贷款额度上限</span><span class=inputWrap_wYUx><input type=number min=0 step=any required aria-label=当地贷款额度上限 value=100 /><span>万元</span></span><small>示例 100 万元，并非全国统一限额</small></label><label class=field_WYGs><span>房屋总价</span><span class=inputWrap_wYUx><input type=number min=0 step=any required aria-label=房屋总价 value=150 /><span>万元</span></span></label><label class=field_WYGs><span>最高贷款成数</span><span class=inputWrap_wYUx><input type=number min=0 step=any required aria-label=最高贷款成数 max=100 value=80 /><span>%</span></span><small>示例 80%，请按当地规则修改</small></label><label class=field_WYGs><span>贷款期限</span><span class=inputWrap_wYUx><input type=number min=1 step=1 required aria-label=贷款期限 max=50 value=30 /><span>年</span></span></label><label class=field_WYGs><span>公积金年利率</span><span class=inputWrap_wYUx><input type=number min=0 step=any required aria-label=公积金年利率 max=100 value=2.6 /><span>%</span></span><small>示例值，请按贷款合同修改</small></label></div><button class=button_awl7 type=submit>评估可贷额度</button><p class=note_NhkL>各地额度规则不同。本估算取余额、偿还能力、输入限额和房价成数四项的最小值，按 100 元向下取整；未判断缴存连续性、征信、房屋套数或地方额外条件。</form><section class=panel_jlQC aria-label=公积金计算结果 aria-live=polite><h2>计算结果</h2><p class=note_NhkL>填写参数后点击计算，查看月供、成本和明细。利率为演示参数，可按贷款合同修改。<p class=note_NhkL>参数设置可参考<a href=https://gjj.wuhan.gov.cn/bsfw/ywzl/cjwt/202605/t20260526_2769099.html target=_blank rel=noreferrer>住房公积金中心额度规则示例</a>，其他城市请使用当地公布的规则与限额。</section></div></div></main></div></body>
